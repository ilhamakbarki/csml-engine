services:
  csml:
    container_name: csml-server
    image: csml:latest
    build:
      context: .
      dockerfile: docker/sb.Dockerfile
    ports:
      - 5001:5000
    env_file:
      - .env
    environment:
      RUST_LOG: ${RUST_LOG:-warn,csml_server=info,csml_engine=info,csml_interpreter=warn,hyper=off,h2=off,reqwest=off,tokio=off,rustls=off}